[tox]
# Dual-version compatibility matrix for the Florence2 processor fix (Issue #21)
# and the Janus dataclass fix (Issue #22).
#
# Each env creates a clean venv with a pinned transformers version and runs the
# standalone test subset (the ones that do NOT import torch / comfy / folder_paths).
# These envs cover the processor loader + config helpers + Janus AST checks across
# transformers versions. They do NOT exercise the model trust_remote_code branch
# (branch A in florence2_caption.py): that requires torch + ComfyUI and is NOT
# covered by the current automated matrix (the existing torch-bearing ComfyUI
# envs are all transformers 4.56.2 and take branch B).
#
# Run the full matrix (all configured environments):
#   tox
# Or a subset:
#   tox -e transformers4,transformers5
#
envlist = transformers4_old, transformers4, transformers5

[testenv]
description = Florence2 processor + Janus dataclass compatibility (standalone tests only)
# These tests import neither torch nor ComfyUI; they exercise the processor
# assembly logic and source-level AST checks, which is exactly what the 4.x/5.x
# split is about. We do NOT install the project package (pyproject.toml targets
# Comfy Registry packaging with flat-layout auto-discovery that conflicts with
# the repo's notes/Images/workflows dirs); instead the source is put on
# PYTHONPATH so the plugin modules import directly.
skip_install = true
deps =
    transformers4_old: transformers==4.49.0
    transformers4: transformers==4.57.0
    transformers5: transformers==5.9.0
    pillow
setenv =
    # Makes the plugin importable as a top-level package (the loader uses
    # absolute imports `from florence2_processor import ...` when run via the
    # test's sys.path manipulation).
    PYTHONPATH = {toxinidir}
commands =
    python tests/test_florence2_processor_compat.py -v
    python tests/test_configuration_florence2_v9_compat.py -v

[testenv:transformers4_old]
description = legacy 4.x processor/helper coverage (transformers 4.49.0). Note: this env does NOT install torch and does not import florence2_caption.py, so it does NOT exercise the <4.51.0 model trust_remote_code branch (branch A). It covers the processor loader + config helpers on a legacy 4.x. Branch-A model loading is NOT covered by the current automated matrix.

[testenv:transformers4]
description = processor/helper coverage on transformers 4.x (4.57.0)

[testenv:transformers5]
description = processor/helper coverage on transformers 5.x (5.9.0, Issue #21 target)
